name: Diverge Health
description: 'Diverge Health is a value-based care company that partners with primary
  care practices to improve outcomes for underserved and Medicaid patient populations.
  It embeds community-based care teams, health coaches, and behavioral health clinicians
  into medical practices to address medical, social, and behavioral needs, supported
  by data aggregation and technology. The company backs providers with chronic disease
  management (diabetes, COPD, hypertension, heart failure), collaborative behavioral
  health, and social-needs support across multiple states. Backed by GV, Diverge Health
  operates as a services and enablement organization rather than a public API provider;
  it currently publishes no developer portal, API documentation, or machine-readable
  interface. This profile tracks its public web presence in the API Evangelist network.'
